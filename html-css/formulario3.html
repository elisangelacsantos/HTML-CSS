<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <h2>Inicio de formulário</h2>
    <form action="index.html" method="get">
        informe seu nome completo: <br>
        <input type="text" name="nome" id="nome">
        <br/>
        Selecione o tipo de combustivel: <br>
        <input type="radio" name="comb" id="comb" value="gas">Gasolina
        <input type="radio" name="comb" id="comb" value="alc">Alcool
        <input type="radio" name="comb" id="comb" value="gnv">GNV
        <input type="radio" name="comb" id="comb" value="flex">Flex
        <br>
        Selecione o tipo de combustivel: <br/>
        <input type="checkbox" name="gas" id="gas" >Gasolina
        <input type="checkbox" name="alc" id="alc" >Alcool
        <input type="checkbox" name="gnv" id="gnv" >GNV
        <input type="checkbox" name="flex" id="flex" value="combus">Flex
        <br>

        escolha o fabricante do carro: <br>
        <select name="car" id="car">
            <option value="fiat">Fiat</option>
            <option value="Gol">Gol</option>
            <option value="BYD">Hyundai</option>
            <option value="Honda">Honda</option>
        </select>
        <br>
        Sugestões: <br>
        <textarea name="dica" id="dica" cols="30" rows="10"></textarea>
        Data cadastro:
        <input type="date" name="dt_cad" id="dt_cad" />
        <br>
        E-mail:
        <br>
        <input type="email" name="email" id="email" required>
        <br>
        <input type="reset" value="Limpar" />
        <input type="submit" value="Enviar" />
    </form>
    <img src="https://studiosilver.com.br/uploads/noticia/conhe-a-mais-sobre-web-design-07-01-2017-171134.jpg">
    </img>


    <a href="index.html">Voltar para a página inicial</a>
</body>
</html>
